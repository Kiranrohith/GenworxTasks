services:

  postgres:
    image: postgres:16
    container_name: postgres_db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: employee

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy


  backend:
    build: ./backend

    container_name: fastapi_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:password@postgres:5432/employee

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build: ./frontend/employee_details

    container_name: react_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend/employee_details:/app
      - /app/node_modules

    depends_on:
      - backend

volumes:
  postgres_data: