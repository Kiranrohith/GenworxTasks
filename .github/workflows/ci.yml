name: Employee Management

on:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week_5/day_24/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v3

      - run: uv sync
      - run: uv run ruff check .

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week_5/day_24/frontend/employee_details

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install
      - run: npm run build
